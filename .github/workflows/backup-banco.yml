name: Backup do banco (Supabase)

# Todo dia às 02:30 (Brasília) e também sob demanda: aba Actions → este
# workflow → "Run workflow".
#
# O repositório é PÚBLICO, então o backup só sai daqui criptografado
# (AES-256). Não imprima nada do dump no log: o log também é público.
#
# Segredos necessários (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL    URI do "Session pooler" do Supabase (Connect → Session
#                      pooler), com a senha do banco já preenchida e
#                      caracteres especiais codificados (ex.: @ vira %40)
#   BACKUP_PASSPHRASE  senha longa para criptografar o backup. Guarde num
#                      gerenciador de senhas: sem ela o backup não abre.
#
# Restauração: supabase/BACKUP-E-RESTAURACAO.md

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Conferir segredos
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PASSPHRASE" ]; then
            echo "::error::Faltam os segredos SUPABASE_DB_URL e/ou BACKUP_PASSPHRASE (veja o cabeçalho deste arquivo)."
            exit 1
          fi

      - name: Exportar o banco
        run: |
          mkdir -p dump
          # Estrutura + dados do schema public (pedidos, cotações, histórico,
          # usuários, fornecedores, empresas, setores, policies, funções).
          docker run --rm -e DB_URL postgres:17 sh -c \
            'pg_dump "$DB_URL" --no-owner --no-privileges --schema=public' > dump/public.sql
          # Logins (e-mail + hash da senha): necessário para os usuários
          # existirem de novo numa restauração.
          docker run --rm -e DB_URL postgres:17 sh -c \
            'pg_dump "$DB_URL" --no-owner --no-privileges --data-only --table=auth.users --table=auth.identities' > dump/auth-dados.sql
          # Sanidade: arquivos não vazios e com a tabela principal.
          test -s dump/public.sql
          test -s dump/auth-dados.sql
          grep -q 'CREATE TABLE public.pedidos_compra' dump/public.sql

      - name: Compactar e criptografar
        run: |
          printf '%s' "$PASSPHRASE" > .pp
          tar czf - dump | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-file .pp --symmetric --cipher-algo AES256 \
            -o "backup-banco-$(date -u +%F).tar.gz.gpg"
          rm -rf .pp dump
          ls -l backup-banco-*.tar.gz.gpg

      - name: Guardar o backup (90 dias)
        uses: actions/upload-artifact@v4
        with:
          name: backup-banco
          path: backup-banco-*.tar.gz.gpg
          retention-days: 90
          if-no-files-found: error
